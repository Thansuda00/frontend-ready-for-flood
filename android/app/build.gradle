apply plugin: "com.android.application"

android {
    namespace = 'com.readyforflood.app'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.readyforflood.app"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    mavenCentral()
    google()
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.2.2")
        // Add other classpaths if needed (e.g., for react-native)
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}